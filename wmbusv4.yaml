dashboard_import:
  package_import_url: github://btmbpl/wmbus/wmbusv4.yaml@main
  import_full_config: true
###
esphome:
  name: wmbus
  friendly_name: wmbus
  project:
    name: btm.wmbus
    version: "1.0"
###
esp32:
  board: esp32dev
  framework:
    type: arduino
###
logger:
  level: WARN
  baud_rate: 0
###
api:
  encryption:
    key: "BSsUx1kEOhkterpf1qcfPdZ6uiLL6GPQnE2eXbgDTvY="
###
ota:
  - platform: esphome
    password: "1bda8135bd7754865f02514b18eda5e7"
###
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: True
  power_save_mode: LIGHT
  ap:
    ssid: "wmbus"
#    password: "12345678"
###
time:
  - platform: sntp
    id: time_sntp
###
debug:
  update_interval: 5s
###
external_components:
  - source: github://SzczepanLeon/esphome-components@version_4
    refresh: 0d
    components: [ wmbus ]
###
captive_portal:
###
wmbus:
  mosi_pin: GPIO23
  miso_pin: GPIO19
  clk_pin:  GPIO18
  cs_pin:   GPIO26
  gdo0_pin: GPIO14
  gdo2_pin: GPIO04
###
  frequency: 868.950
  all_drivers: True
  sync_mode: True
  log_all: False
###
sensor:
### apator ###
  - platform: wmbus
    meter_id: 0x04355840
    type: apator162
    key: "00000000000000000000000000000000"
    sensors:
      - name: "RSSi licznik wody"
        field: "rssi"
        accuracy_decimals: 0
        unit_of_measurement: "dBm"
        device_class: "signal_strength"
        state_class: "measurement"
        entity_category: "diagnostic"
      - name: "licznik wody"
        field: "total"
        accuracy_decimals: 3
        id: apator
        unit_of_measurement: "m³"
        device_class: "water"
        state_class: "total_increasing"
        icon: "mdi:water"
        filters:
          - lambda: return (x + id(ofa).state);
## ------------------ ##
## Diagnostic Sensors ##
## ------------------ ##
  - platform: wifi_signal # Reports the WiFi signal strength/RSSI in dB
    name: "Signal dB"
    id: wifi_signal_db
    update_interval: 60s
    entity_category: "diagnostic"
  - platform: copy # Reports the WiFi signal strength in %
    source_id: wifi_signal_db
    name: "Signal"
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    icon: "mdi:wifi"
    unit_of_measurement: "%"
    entity_category: "diagnostic"
    device_class: ""
  - platform: internal_temperature
    name: "CPU Temperature"
    id: cpu_temp
### ------------- ###
### Number Sensor ###
### ------------- ###
number:
  - platform: template
    name: "offset apator"
    id: ofa
    optimistic: true
    min_value: -500
    max_value: 500
    step: 0.001
    initial_value: 0
    mode: box
    restore_value: true
#  - platform: template
#    name: "offset izar"
#    id: ofi
#    optimistic: true
#    min_value: -500
#    max_value: 500
#    step: 0.001
#    initial_value: 0
#    mode: box
#    restore_value: true
#  - platform: template
#    name: "offset unismart"
#    id: ofu
#    optimistic: true
#    min_value: -500
#    max_value: 500
#    step: 0.001
#    initial_value: 0
#    mode: box
#    restore_value: true
###
web_server: 
  port: 80
  version: 3
## ------------------ ##
## Diagnostic Sensors ##
## ------------------ ##
text_sensor:
  - platform: wifi_info
    ip_address:
      name: IP
      icon: "mdi:ip-network"
    ssid:
      name: SSID
      icon: "mdi:access-point-network"
  - platform: version
    name: Version
    hide_timestamp: true
    disabled_by_default: false
    icon: mdi:new-box
    entity_category: "diagnostic"
  - platform: uptime
    name: Uptime
    format:
      separator: " "
      days: "d  "
      hours: " h :"
      minutes: " m"
      expand: true
  - platform: template
    name: "Current Time"
    id: current_time
    update_interval: 10s
    lambda: return  id(time_sntp).now().strftime("%H:%M");
    entity_category: "diagnostic"
    icon: "mdi:clock"
  - platform: debug
    reset_reason:
      name: "Reset Reason"
#
button:
  - platform: restart
    name: Restart
    entity_category: "config"
#
switch:
  - platform: restart
    name: Restart
    id: restart1
    entity_category: "config"
    internal: true
## ------------------ ##
## End of Diagnostic  ##
## ------------------ ##
