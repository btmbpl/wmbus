  framework:
    type: arduino
#
logger:
  level: WARN
  baud_rate: 0
#
api:
  encryption:
    key: "BSsUx1kEOhkterpf1qcfPdZ6uiLL6GPQnE2eXbgDTvY="
#
ota:
  - platform: esphome
    password: "1bda8135bd7754865f02514b18eda5e7"
#
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: True
  power_save_mode: LIGHT
  ap:
    ssid: "wmbus"
#    password: "12345678"
#
time:
  - platform: sntp
    id: time_sntp
#
external_components:
  - source: github://SzczepanLeon/esphome-components@version_4
    refresh: 0d
    components: [ wmbus ]
#
packages:
  maintenance: !include common/maintenance.yaml
#
captive_portal:
#
wmbus:
  mosi_pin: GPIO23
  miso_pin: GPIO19
  clk_pin:  GPIO18
  cs_pin:   GPIO26
  gdo0_pin: GPIO14
  gdo2_pin: GPIO04
#
  frequency: 868.950
  all_drivers: True
  sync_mode: True
  log_all: False
#
sensor:
### apator ###
  - platform: wmbus
    meter_id: 0x04355840
    type: apator162
    key: "00000000000000000000000000000000"
    sensors:
      - name: "RSSi licznik wody"
        field: "rssi"
        accuracy_decimals: 0
        unit_of_measurement: "dBm"
        device_class: "signal_strength"
        state_class: "measurement"
        entity_category: "diagnostic"
      - name: "licznik wody"
        field: "total"
        accuracy_decimals: 3
        id: apator
        unit_of_measurement: "m³"
        device_class: "water"
        state_class: "total_increasing"
        icon: "mdi:water"
        filters:
          - lambda: return (x + id(ofa).state);
### ------------- ###
### Number Sensor ###
### ------------- ###
number:
  - platform: template
    name: "offset apator"
    id: ofa
    optimistic: true
    min_value: -500
    max_value: 500
    step: 0.001
    initial_value: 0
    mode: box
    restore_value: true
